<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Rest bar · counting down</title>
<style>body{margin:0}
body{background:#0a0a0a}</style>
</head>
<body>

<div style="width: 390px; height: 200px; position: relative; overflow: hidden; background: #0a0a0a; color: #f5f5f4; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif">
  <div style="position: absolute; left: 16px; right: 16px; top: 16px; height: 60px; border-radius: 14px; background: #161616; opacity: 0.5"></div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #161616; border-top: 1px solid rgba(245,245,244,0.1)">
    <div style="height: 4px; background: #262626"><div style="width: 38%; height: 100%; background: #fb923c"></div></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px 30px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: rgba(245,245,244,0.6)">Rest · Set 2 of Cable Fly next</span>
        <span style="font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.5px">1:52</span>
      </div>
      <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 12px; border: 0; background: #0a0a0a; color: #f5f5f4; font: inherit; font-size: 15px; font-weight: 600">+30 s</button>
      <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 12px; border: 0; background: #0a0a0a; color: #f5f5f4; font: inherit; font-size: 15px; font-weight: 600">Skip</button>
    </div>
  </div>
</div>
</body>
</html>
