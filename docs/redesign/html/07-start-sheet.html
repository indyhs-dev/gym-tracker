<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Start workout sheet</title>
<style>body{margin:0}
body{background:#0a0a0a}</style>
</head>
<body>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #050505; color: #f5f5f4; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif">
  <div style="padding: 20px 16px; opacity: 0.25">
    <h1 style="margin: 0; font-size: 34px; font-weight: 800">Gym</h1>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 64px; bottom: 0; border-radius: 20px 20px 0 0; background: #0a0a0a; border-top: 1px solid rgba(245,245,244,0.1); display: flex; flex-direction: column">
    <div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 40px; height: 5px; border-radius: 3px; background: rgba(245,245,244,0.25)"></span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 14px">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700">Start workout</h2>
      <button type="button" style="min-height: 44px; padding: 0 4px; border: 0; background: none; color: rgba(245,245,244,0.6); font: inherit; font-size: 17px">Cancel</button>
    </div>

    <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
      <button type="button" style="box-sizing: border-box; width: 100%; padding: 16px; border-radius: 16px; border: 1.5px solid #fb923c; background: #161616; color: #f5f5f4; font: inherit; text-align: left; display: flex; align-items: center; gap: 12px">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <span style="display: flex; align-items: center; gap: 8px">
            <span style="font-size: 20px; font-weight: 700">Legs</span>
            <span style="padding: 2px 8px; border-radius: 6px; background: rgba(251,146,60,0.16); color: #fb923c; font-size: 12px; font-weight: 700; letter-spacing: 0.4px">NEXT UP</span>
          </span>
          <span style="font-size: 14px; color: rgba(245,245,244,0.6)">5 exercises · last done Thu 15 Oct</span>
        </span>
        <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="rgba(245,245,244,0.6)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg>
      </button>

      <div style="border-radius: 16px; background: #161616; overflow: hidden; display: flex; flex-direction: column">
        <button type="button" style="padding: 14px 16px; border: 0; border-bottom: 1px solid rgba(245,245,244,0.1); background: none; color: #f5f5f4; font: inherit; text-align: left; display: flex; align-items: center; gap: 12px">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 17px; font-weight: 600">Shoulders &amp; Arms</span>
            <span style="font-size: 14px; color: rgba(245,245,244,0.6)">8 exercises · last done Mon 19 Oct</span>
          </span>
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="rgba(245,245,244,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg>
        </button>
        <button type="button" style="padding: 14px 16px; border: 0; border-bottom: 1px solid rgba(245,245,244,0.1); background: none; color: #f5f5f4; font: inherit; text-align: left; display: flex; align-items: center; gap: 12px">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 17px; font-weight: 600">Torso</span>
            <span style="font-size: 14px; color: rgba(245,245,244,0.6)">7 exercises · last done Wed 21 Oct</span>
          </span>
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="rgba(245,245,244,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg>
        </button>
        <button type="button" style="padding: 14px 16px; border: 0; background: none; color: #f5f5f4; font: inherit; text-align: left; display: flex; align-items: center; gap: 12px">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 17px; font-weight: 600">Blank workout</span>
            <span style="font-size: 14px; color: rgba(245,245,244,0.6)">Add exercises as you go</span>
          </span>
          <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="rgba(245,245,244,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg>
        </button>
      </div>

      <button type="button" style="margin-top: 6px; min-height: 48px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(245,245,244,0.1); background: none; color: #f5f5f4; font: inherit; display: flex; align-items: center; justify-content: space-between">
        <span style="font-size: 15px; color: rgba(245,245,244,0.6)">Date</span>
        <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 600">Today
          <svg width="12" height="8" viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1.5 1.5 4.5 4.5 4.5-4.5"></path></svg>
        </span>
      </button>
      <span style="font-size: 13px; color: rgba(245,245,244,0.6); padding: 0 4px">Change the date only when logging a past workout.</span>
    </div>
  </div>
</div>
</body>
</html>
