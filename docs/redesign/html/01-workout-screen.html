<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Workout · Option A</title>
<style>body{margin:0}
a{color:#fb923c}a:hover{color:#fdba74}
input::placeholder{color:rgba(245,245,244,0.35)}
body{background:#0a0a0a}</style>
</head>
<body>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0a0a0a; color: #f5f5f4; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid rgba(245,245,244,0.1)">
    <a href="#" style="display: flex; align-items: center; gap: 4px; min-height: 44px; color: rgba(245,245,244,0.6); text-decoration: none; font-size: 17px">
      <svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2 2 8l6 6"></path></svg>
      Today
    </a>
    <div style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">24:12</div>
    <button type="button" style="min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid rgba(245,245,244,0.18); background: #161616; color: #f5f5f4; font: inherit; font-size: 16px; font-weight: 600">Finish</button>
  </header>

  <div style="padding: 16px 16px 12px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px">Torso</h1>
      <span style="font-size: 14px; color: rgba(245,245,244,0.6); font-variant-numeric: tabular-nums">5 of 15 sets</span>
    </div>
    <div style="height: 6px; border-radius: 3px; background: #1f1f1f; overflow: hidden" role="img" aria-label="5 of 15 sets done">
      <div style="width: 33%; height: 100%; background: #fb923c; border-radius: 3px"></div>
    </div>
  </div>

  <div style="flex: 1; overflow: hidden; padding: 4px 16px 0; display: flex; flex-direction: column; gap: 8px">

    <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: #121212">
      <span style="width: 24px; height: 24px; border-radius: 12px; background: rgba(34,197,94,0.18); color: #22c55e; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.5 7.5 3 3 6-7"></path></svg>
      </span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 8px 0">
        <span style="font-size: 16px; color: rgba(245,245,244,0.6)">Flat Dumbbell Bench Press</span>
        <span style="font-size: 13px; font-weight: 600; color: #fb923c">↑ Go to 35 kg next time</span>
      </span>
      <span style="font-size: 14px; color: rgba(245,245,244,0.6); font-variant-numeric: tabular-nums">32.5 × 12</span>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: #121212">
      <span style="width: 24px; height: 24px; border-radius: 12px; background: rgba(34,197,94,0.18); color: #22c55e; display: flex; align-items: center; justify-content: center">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.5 7.5 3 3 6-7"></path></svg>
      </span>
      <span style="flex: 1; font-size: 16px; color: rgba(245,245,244,0.6)">Dips</span>
      <span style="font-size: 14px; color: rgba(245,245,244,0.6); font-variant-numeric: tabular-nums">BW × 11</span>
    </div>

    <section style="border-radius: 16px; background: #161616; border: 1px solid rgba(251,146,60,0.45); padding: 16px 14px 14px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: flex-start; gap: 8px">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <h2 style="margin: 0; font-size: 21px; font-weight: 700">Cable Fly</h2>
          <span style="font-size: 14px; color: rgba(245,245,244,0.6)">2 × 8–15 · Rest 90 s–3 min</span>
        </div>
        <button type="button" aria-label="Start warm-up rest timer" style="min-height: 44px; padding: 0 12px; border-radius: 10px; border: 0; background: #0a0a0a; color: #f5f5f4; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="9" r="5.5"></circle><path d="M8 9V6.5M6.5 1.5h3"></path></svg>
          Warm-up
        </button>
        <button type="button" aria-label="Cable Fly options" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: #0a0a0a; color: rgba(245,245,244,0.6); display: flex; align-items: center; justify-content: center">
          <svg width="18" height="4" viewBox="0 0 18 4" fill="currentColor" aria-hidden="true"><circle cx="2" cy="2" r="2"></circle><circle cx="9" cy="2" r="2"></circle><circle cx="16" cy="2" r="2"></circle></svg>
        </button>
      </div>

      <div style="display: grid; grid-template-columns: 32px minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: 0.6px; color: rgba(245,245,244,0.6)">
        <span style="text-align: center">SET</span>
        <span style="text-align: center">KG EACH</span>
        <span style="text-align: center">REPS</span>
        <span></span>
      </div>

      <div style="display: grid; grid-template-columns: 32px minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center">
        <span style="text-align: center; font-size: 16px; font-weight: 700; color: rgba(245,245,244,0.6)">1</span>
        <div style="height: 44px; border-radius: 10px; background: rgba(34,197,94,0.12); display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums">15</div>
        <div style="height: 44px; border-radius: 10px; background: rgba(34,197,94,0.12); display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums">13</div>
        <button type="button" aria-label="Set 1 done" style="width: 44px; height: 44px; border-radius: 10px; border: 0; background: #22c55e; color: #0a0a0a; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.5 7.5 3 3 6-7"></path></svg>
        </button>
      </div>

      <div style="display: grid; grid-template-columns: 32px minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center">
        <span style="text-align: center; font-size: 16px; font-weight: 700; color: #fb923c">2</span>
        <label style="position: relative; display: block">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Set 2 kg each</span>
          <input inputmode="decimal" placeholder="15" style="box-sizing: border-box; width: 100%; height: 44px; border-radius: 10px; border: 1.5px solid #fb923c; background: #0a0a0a; color: #f5f5f4; text-align: center; font: inherit; font-size: 19px; font-weight: 700">
        </label>
        <label style="position: relative; display: block">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Set 2 reps</span>
          <input inputmode="numeric" placeholder="12" style="box-sizing: border-box; width: 100%; height: 44px; border-radius: 10px; border: 1px solid rgba(245,245,244,0.1); background: #0a0a0a; color: #f5f5f4; text-align: center; font: inherit; font-size: 19px; font-weight: 700">
        </label>
        <button type="button" aria-label="Set 2 done" style="width: 44px; height: 44px; border-radius: 10px; border: 1px solid rgba(245,245,244,0.18); background: #0a0a0a; color: rgba(245,245,244,0.6); display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2.5 7.5 3 3 6-7"></path></svg>
        </button>
      </div>

      <button type="button" style="align-self: center; min-height: 44px; padding: 0 16px; border: 0; background: none; color: #f5f5f4; font: inherit; font-size: 15px; font-weight: 600">+ Add set</button>
    </section>

    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.6px; color: rgba(245,245,244,0.6); padding: 6px 2px 0">UP NEXT</div>

    <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: #161616">
      <span style="flex: 1; font-size: 16px">Pull-up</span>
      <span style="font-size: 14px; color: rgba(245,245,244,0.6)">2 × 5–12</span>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="rgba(245,245,244,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: #161616">
      <span style="flex: 1; font-size: 16px">Chest-supported Row</span>
      <span style="font-size: 14px; color: rgba(245,245,244,0.6)">2 × 5–12</span>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="rgba(245,245,244,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: #161616">
      <span style="flex: 1; font-size: 16px">Back Extension</span>
      <span style="font-size: 14px; color: rgba(245,245,244,0.6)">2 × 8–25</span>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="rgba(245,245,244,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border-radius: 14px; background: #161616">
      <span style="flex: 1; font-size: 16px">Hanging Knee Raise</span>
      <span style="font-size: 14px; color: rgba(245,245,244,0.6)">3 × 5</span>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="rgba(245,245,244,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #161616; border-top: 1px solid rgba(245,245,244,0.1)">
    <div style="height: 4px; background: #262626"><div style="width: 38%; height: 100%; background: #fb923c"></div></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px 26px">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: rgba(245,245,244,0.6)">Rest · Set 2 next</span>
        <span style="font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.5px">1:52</span>
      </div>
      <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 12px; border: 0; background: #0a0a0a; color: #f5f5f4; font: inherit; font-size: 15px; font-weight: 600">+30 s</button>
      <button type="button" style="min-height: 44px; padding: 0 14px; border-radius: 12px; border: 0; background: #0a0a0a; color: #f5f5f4; font: inherit; font-size: 15px; font-weight: 600">Skip</button>
    </div>
  </div>
</div>
</body>
</html>
