<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<title>Workout finished</title>
<style>body{margin:0}
a{color:#fb923c}a:hover{color:#fdba74}
textarea::placeholder{color:rgba(245,245,244,0.35)}
body{background:#0a0a0a}</style>
</head>
<body>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0a0a0a; color: #f5f5f4; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px">
    <a href="#" style="display: flex; align-items: center; gap: 4px; min-height: 44px; color: rgba(245,245,244,0.6); text-decoration: none; font-size: 17px">
      <svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2 2 8l6 6"></path></svg>
      Back to workout
    </a>
  </header>

  <div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-size: 32px; font-weight: 800; letter-spacing: -0.6px">Torso done</h1>
    <span style="font-size: 15px; color: rgba(245,245,244,0.6)">Sunday 25 Oct · 6:15 – 7:13 PM</span>
  </div>

  <div style="margin: 18px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <div style="padding: 14px 12px; border-radius: 14px; background: #161616; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums">58m</span>
      <span style="font-size: 13px; color: rgba(245,245,244,0.6)">time</span>
    </div>
    <div style="padding: 14px 12px; border-radius: 14px; background: #161616; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums">15</span>
      <span style="font-size: 13px; color: rgba(245,245,244,0.6)">working sets</span>
    </div>
    <div style="padding: 14px 12px; border-radius: 14px; background: #161616; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums">2</span>
      <span style="font-size: 13px; color: rgba(245,245,244,0.6)">new bests</span>
    </div>
  </div>

  <section style="margin: 12px 16px 0; padding: 16px; border-radius: 16px; background: #161616; border: 1px solid rgba(251,146,60,0.45); display: flex; flex-direction: column; gap: 12px">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.6px; color: #fb923c">GO UP NEXT TIME</span>
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <span style="font-size: 16px">Flat Dumbbell Bench Press</span>
      <span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap">32.5 → 35 kg</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px">
      <span style="font-size: 16px">Back Extension</span>
      <span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap">10 → 12.5 kg</span>
    </div>
  </section>

  <section style="margin: 12px 16px 0; padding: 6px 16px; border-radius: 16px; background: #161616; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-bottom: 1px solid rgba(245,245,244,0.1)">
      <span style="font-size: 15px">Cable Fly</span>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-variant-numeric: tabular-nums"><span style="padding: 2px 6px; border-radius: 6px; background: rgba(34,197,94,0.16); color: #22c55e; font-size: 11px; font-weight: 700; letter-spacing: 0.4px">BEST</span>15 × 14</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; border-bottom: 1px solid rgba(245,245,244,0.1)">
      <span style="font-size: 15px">Pull-up</span>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-variant-numeric: tabular-nums"><span style="padding: 2px 6px; border-radius: 6px; background: rgba(34,197,94,0.16); color: #22c55e; font-size: 11px; font-weight: 700; letter-spacing: 0.4px">BEST</span>BW × 9</span>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; min-height: 44px">
      <span style="font-size: 15px; color: rgba(245,245,244,0.6)">+ 5 more exercises</span>
      <svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="rgba(245,245,244,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m1.5 1.5 5 5.5-5 5.5"></path></svg>
    </div>
  </section>

  <label style="margin: 12px 16px 0; display: block">
    <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Session note</span>
    <textarea placeholder="Session note (optional)" rows="2" style="box-sizing: border-box; width: 100%; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(245,245,244,0.1); background: #0a0a0a; color: #f5f5f4; font: inherit; font-size: 15px; resize: none"></textarea>
  </label>

  <div style="flex: 1"></div>

  <div style="padding: 0 16px 28px">
    <button type="button" style="width: 100%; height: 56px; border-radius: 14px; border: 0; background: #fb923c; color: #0a0a0a; font: inherit; font-size: 18px; font-weight: 700">Save workout</button>
  </div>
</div>
</body>
</html>
